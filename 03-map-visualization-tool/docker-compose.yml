version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: triply_map_viz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triply_map_viz_db}
      POSTGRES_USER: ${POSTGRES_USER:-triply_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triply_secret_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - map_viz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triply_user} -d ${POSTGRES_DB:-triply_map_viz_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: triply_map_viz_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - map_viz_minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triply_map_viz_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-triply_user}:${POSTGRES_PASSWORD:-triply_secret_password}@postgres:5432/${POSTGRES_DB:-triply_map_viz_db}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: triply-spatial-datasets
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "4003:4003"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: triply_map_viz_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4003/api/v1
    ports:
      - "3003:3000"

volumes:
  map_viz_postgres_data:
  map_viz_minio_data:
