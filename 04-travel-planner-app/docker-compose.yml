version: '3.8'

services:
  travel-planner-db:
    image: postgres:16-alpine
    container_name: triply_travel_planner_db
    environment:
      POSTGRES_DB: triply_travel_planner_db
      POSTGRES_USER: triply_user
      POSTGRES_PASSWORD: triply_secure_password_2026
    ports:
      - "5435:5432"
    volumes:
      - travel_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triply_user -d triply_travel_planner_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  travel-planner-redis:
    image: redis:7-alpine
    container_name: triply_travel_planner_redis
    ports:
      - "6382:6379"
    volumes:
      - travel_planner_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  travel-planner-minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: triply_travel_planner_minio
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password_2026
    command: server /data --console-address ":9001"
    ports:
      - "9005:9000"
      - "9006:9001"
    volumes:
      - travel_planner_miniodata:/data

volumes:
  travel_planner_pgdata:
  travel_planner_redisdata:
  travel_planner_miniodata:
