version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: triply_location_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triply_location_db}
      POSTGRES_USER: ${POSTGRES_USER:-triply_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triply_secret_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - location_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triply_user} -d ${POSTGRES_DB:-triply_location_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: triply_location_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - location_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triply_location_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-triply_user}:${POSTGRES_PASSWORD:-triply_secret_password}@postgres:5432/${POSTGRES_DB:-triply_location_db}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "4002:4002"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: triply_location_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4002/api/v1
    ports:
      - "3002:3000"

volumes:
  location_postgres_data:
  location_redis_data:
