version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: triply_weather_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triply_weather_db}
      POSTGRES_USER: ${POSTGRES_USER:-triply_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triply_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - weather_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-triply_user} -d ${POSTGRES_DB:-triply_weather_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: triply_weather_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - weather_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: triply_weather_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-triply_user}:${POSTGRES_PASSWORD:-triply_secret_password}@postgres:5432/${POSTGRES_DB:-triply_weather_db}?schema=public
      REDIS_URL: redis://redis:6379
      WEATHER_PROVIDER: open-meteo
      WEATHER_API_BUDGET_DAILY: 10000
    ports:
      - "4001:4001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: triply_weather_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4001/api/v1
    ports:
      - "3001:3000"

volumes:
  weather_postgres_data:
  weather_redis_data:
